name: Segundo pipeline JavaScript

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'test_*.js'
      - 'package.json'
      - '.github/workflows/segundo_pipeline.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app.js'
      - 'test_*.js'
      - 'package.json'
      - '.github/workflows/segundo_pipeline.yml'

jobs:

  testesoma:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Instalar dependências
        run: npm ci

      - name: Executar teste de soma
        run: node ./node_modules/jest/bin/jest.js --runInBand --runTestsByPath test_soma.js


  testesubtracao:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Instalar dependências
        run: npm ci

      - name: Executar teste de subtração
        run: node ./node_modules/jest/bin/jest.js --runInBand --runTestsByPath test_sub.js


  testemultiplicacao:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Instalar dependências
        run: npm ci

      - name: Executar teste de multiplicação
        run: node ./node_modules/jest/bin/jest.js --runInBand --runTestsByPath test_mult.js


  testedivisao:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Instalar dependências
        run: npm ci

      - name: Executar teste de divisão
        run: node ./node_modules/jest/bin/jest.js --runInBand --runTestsByPath test_div.js


  deploy:
    needs:
      - testesoma
      - testesubtracao
      - testemultiplicacao
      - testedivisao

    runs-on: ubuntu-latest

    steps:
      - name: Deploy
        run: echo "Deploy realizado com sucesso!"